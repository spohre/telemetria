# Configuração da conexão JDBC.
# Qualquer chave pode ser sobrescrita na linha de comando: -Ddb.url=...
#
# H2 em modo ARQUIVO: o banco fica em ./data/telemetria.mv.db e sobrevive ao encerramento do programa.
# DB_CLOSE_DELAY=-1 mantém o banco aberto até a JVM terminar. Sem isso, como cada operação abre e
# fecha a sua conexão, o H2 fecha e reabre o arquivo a cada alerta — no teste de estresse isso
# derrubava a vazão de ~3.900 para ~1.000 leituras/s (ver docs/estresse.md).
db.url=jdbc:h2:./data/telemetria;DB_CLOSE_DELAY=-1
db.usuario=sa
db.senha=

# --- Alternativa PostgreSQL (adicionar o driver org.postgresql:postgresql no pom.xml) ---
# db.url=jdbc:postgresql://localhost:5432/telemetria
# db.usuario=postgres
# db.senha=postgres
